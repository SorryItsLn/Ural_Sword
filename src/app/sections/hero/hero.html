<section class="hero" id="top">
  <video
    #heroVideo
    class="hero__media"
    src="assets/video/hero.mp4"
    poster="assets/img/hero-poster.jpg"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    disablepictureinpicture
    aria-hidden="true"
    tabindex="-1"
  ></video>
  <div class="hero__overlay"></div>

  <div class="container hero__content">
    <p class="hero__eyebrow">Меч Урала · исторический средневековый бой</p>
    <h1 class="hero__title">Ural Sword</h1>
    <p class="hero__meta">6 февраля 2027 · СК «Сухарева», Пермь</p>
    <div class="hero__actions">
      <a class="btn" href="#tickets">Купить билет</a>
      <a class="btn btn--ghost" href="#about">Подробнее</a>
    </div>
  </div>
</section>
