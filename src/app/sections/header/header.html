<header class="header">
  <div class="container header__inner">
    <a class="header__logo" href="#top" (click)="closeMenu()">
      <img src="logo.svg" alt="Ural Sword" width="160" height="40" />
    </a>

    <nav class="header__nav" [class.header__nav--open]="isMenuOpen()">
      @for (link of links; track link.href) {
        <a class="header__link" [href]="link.href" (click)="closeMenu()">{{ link.label }}</a>
      }
      <a class="btn header__cta" href="#tickets" (click)="closeMenu()">Билеты</a>
    </nav>

    <button
      class="header__burger"
      type="button"
      aria-label="Меню"
      [attr.aria-expanded]="isMenuOpen()"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
