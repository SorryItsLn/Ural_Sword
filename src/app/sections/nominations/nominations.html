<section class="section section--muted" id="nominations">
  <div class="container">
    <h2 class="section__title">Номинации</h2>
    <p class="section__lead">
      Командные сражения на большом ристалище. Заявки — от команд в форматах 5×5 и 12×12.
    </p>

    <ul class="nominations">
      @for (nomination of nominations; track $index) {
        <li class="card nominations__item">
          <app-photo
            class="nominations__photo"
            [src]="nomination.photo"
            [alt]="nomination.title"
            label="фото 4:3"
          />
          <h3 class="nominations__title">Командные бои {{ nomination.title }}</h3>
          <p class="nominations__desc">{{ nomination.description }}</p>
        </li>
      }
    </ul>
  </div>
</section>
